<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To'yga Taklifnoma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 28px;
        }
        h2 {
            font-size: 22px;
            margin: 20px 0;
            color: #444;
        }
        p {
            color: #666;
            line-height: 1.6;
            font-size: 16px;
        }
        .date {
            margin-top: 30px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Aziz mehmon!</h1>
        <p>Sizni turmush qurish oqshomimizga bag'ishlangan tantanali to'y stolimizga lutfan taklif etamiz.</p>
        <h2>Murod & Kelin</h2>
        <div class="date">📅 2026-yil 25-sentyabr</div>
        <p style="margin-top: 15px; font-size: 14px;">📍 "Tamosha" to'yxonasi, Toshkent</p>
    </div>

</body>
</html>
